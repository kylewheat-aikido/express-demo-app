name: Auto-approve on Aikido pass

on:
  check_run:
    types: [completed]

jobs:
  approve:
    if: >
      github.event.check_run.name == 'Aikido Security: check code' &&
      github.event.check_run.conclusion == 'success' &&
      join(github.event.check_run.pull_requests.*.number, '') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.APPROVERTOKEN }}
          PR: ${{ github.event.check_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pulls/${PR}/reviews" \
            -d '{
              "body": "Aikido Security check passed, auto-approving.",
              "event": "APPROVE"
            }'