name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for keyless (OIDC) upload to Aikido
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests with coverage (writes lcov.info)
        run: npm run test:coverage | tee coverage.log
      - name: Coverage summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/start of coverage/,/end of coverage/p' coverage.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Aikido Code Coverage
        if: github.event_name == 'push'
        uses: AikidoSec/code-coverage-github-action@v2.1.1
        with:
          file-paths: lcov.info
